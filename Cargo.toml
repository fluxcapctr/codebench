[package]
name = "codebench"
version = "0.1.0"
edition = "2024"
description = "Terminal-first workspace for running coding agents across projects, styled by the active Omarchy theme"
license = "MIT"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
vte = { version = "0.10", package = "vte4", features = ["v0_80"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
lto = "thin"
