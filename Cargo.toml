[package]
name = "codebench"
version = "0.1.0"
edition = "2024"
description = "Terminal-first workspace for running coding agents across projects, styled by the active Omarchy theme"
license = "MIT"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_16"] }
vte = { version = "0.10", package = "vte4", features = ["v0_80"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
async-channel = "2"
sha2 = "0.10"
getrandom = "0.3"
web-push = "0.11"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
lto = "thin"
