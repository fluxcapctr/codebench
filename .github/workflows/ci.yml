name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    # Arch has the VTE 0.80+ this needs; Ubuntu 24.04 ships an older one.
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 vte4
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: cargo test --release --locked
